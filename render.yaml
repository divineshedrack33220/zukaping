services:
  - type: web
    name: coded-backend
    env: go
    buildCommand: cd backend && go build -o coded-backend
    startCommand: cd backend && ./coded-backend
    envVars:
      - key: PORT
        value: 10000
      - key: GIN_MODE
        value: release
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SEERBIT_SECRET_KEY
        sync: false
      - key: SEERBIT_PUBLIC_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: static
    name: zukaping-web
    rootDir: web_app
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # No VITE_API_URL on purpose: baking in one host would pin the built app to
    # it, and web_app/src/services/server-selector.ts already probes every
    # backend and follows whichever one answers.

