<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZukaPing Admin</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- LOGIN -->
  <div id="login-view">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">Z</div>
        <div>
          <h1>ZukaPing Admin</h1>
        </div>
      </div>
      <p class="sub">Sign in to manage the platform</p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app-view">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo-mark">Z</div>
          <div class="title">ZukaPing<small>Admin Panel</small></div>
        </div>
        <nav class="nav">
          <div class="nav-section">Overview</div>
          <a href="#/dashboard" data-route="dashboard"><span class="icon">▦</span> Dashboard</a>
          <div class="nav-section">Management</div>
          <a href="#/users" data-route="users"><span class="icon">👥</span> Users</a>
          <a href="#/posts" data-route="posts"><span class="icon">📝</span> Posts</a>
          <a href="#/chats" data-route="chats"><span class="icon">💬</span> Chats</a>
          <a href="#/messages" data-route="messages"><span class="icon">✉️</span> Messages</a>
          <a href="#/rooms" data-route="rooms"><span class="icon">🏠</span> Rooms</a>
          <div class="nav-section">Engagement</div>
          <a href="#/favorites" data-route="favorites"><span class="icon">❤️</span> Favorites</a>
          <a href="#/purchases" data-route="purchases"><span class="icon">💳</span> Purchases</a>
          <a href="#/audit" data-route="audit"><span class="icon">🛡️</span> Audit Log</a>
        </nav>
        <div class="admin-box">
          <img id="admin-avatar" alt="" />
          <div class="meta">
            <div class="name" id="admin-name"></div>
            <div class="email" id="admin-email"></div>
          </div>
          <button class="logout" id="logout-btn" title="Sign out">⎋</button>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <h2 id="page-title">Dashboard</h2>
          <div class="actions">
            <button class="btn btn-ghost" id="refresh-btn">⟳ Refresh</button>
          </div>
        </div>
        <div id="content"></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="btn-close" id="modal-close">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
